[project]
name = "enterprise-agent-backend"
version = "0.1.0"
description = "Financial domain API for the enterprise agent prototype"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0.38,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "PyJWT>=2.10,<3",
  "langgraph>=1.0,<2",
  "httpx>=0.28,<1",
  "tzdata>=2025.2",
  "langsmith>=0.4,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enterprise_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-local-folder = ["conftest"]
