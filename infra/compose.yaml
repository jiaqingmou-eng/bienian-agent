name: enterprise-agent

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-enterprise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_agent}
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../services/backend
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-enterprise}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-enterprise_agent}
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)",
        ]
      interval: 5s
      timeout: 4s
      retries: 15

  bff:
    build:
      context: ../apps/bff
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:5173}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET:?Set INTERNAL_JWT_SECRET}
      ENABLE_DEMO_LOGIN: ${ENABLE_DEMO_LOGIN:-false}
      BFF_PORT: ${BFF_PORT:-3000}
      BACKEND_URL: http://backend:8000
      BFF_HOST: 0.0.0.0
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      backend:
        condition: service_healthy

  web:
    build:
      context: ../apps/web
    ports:
      - '127.0.0.1:5173:8080'
    depends_on:
      - bff

volumes:
  postgres-data:
